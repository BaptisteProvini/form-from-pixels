name: Publier l'application

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Compiler
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Vérifier les types
        run: npx tsc --noEmit
        continue-on-error: true
      - name: Tests
        run: npm test
      - name: Test dans un navigateur
        run: |
          npm install --no-save --no-audit --no-fund --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium
          (npx vite preview --port 4173 --strictPort > preview.log 2>&1 &)
          sleep 4
          node scripts/e2e.mjs
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          E2E_URL: http://localhost:4173/${{ github.event.repository.name }}/
      - name: Préparer la publication
        run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
